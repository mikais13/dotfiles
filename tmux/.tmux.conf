# leader/prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# enable mouse scrolling
set -g mouse

# terminal colours: enable true colour / 256-colour support
set -ag terminal-overrides ",*256col*:Tc"
set-option -g default-terminal "tmux-256color"

# window/pane creation: open new windows and splits in the current pane's path
bind c new-window -c "#{pane_current_path}"
unbind %
bind h split-window -h -c "#{pane_current_path}"
unbind '"'
bind v split-window -v -c "#{pane_current_path}"

# pane resize via shift+arrow (repeatable while held)
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5

# move focus between panes via plain arrow keys
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# kill current pane without confirmation prompt
bind x kill-pane

# fuzzy session/window switcher (fzf)
bind m display-popup -E -B -w 80% -h 80% "~/dotfiles/tmux/scripts/tmux-menu.sh"

# fuzzy-find a project and open/switch to its tmux session
bind f display-popup -E -B -w 90% -h 90% "~/dotfiles/tmux/scripts/tmux-sessionizer.sh"

# scrollback: keep 50000 lines of history per pane
set -g history-limit 50000

# when a session is destroyed, switch to another instead of detaching
set -g detach-on-destroy off

# start window/pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# plugins (managed by tpm): sensible defaults, session persistence
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto save / restore session state
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# add better menus
set -g @plugin 'jaclu/tmux-menus'

# catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'

# force active-window separators to re-derive from the style above instead of
# sticking to whatever shape was set on a previous reload
set -ug @catppuccin_window_current_left_separator
set -ug @catppuccin_window_current_middle_separator
set -ug @catppuccin_window_current_right_separator

# flatten status-right module pills to match the basic window style
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "

# drop the clock icon entirely
set -g @catppuccin_date_time_icon ""

# add prefix highlight to status line
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g status-right-length 100
set -g status-left-length 100
set -g status-right '#{prefix_highlight}'
set -agF status-right '#{E:@catppuccin_status_date_time}'

# fuzzy findable completions based on output
set -g @plugin 'laktak/extrakto'

# session/window tree: show sessions collapsed by default (press l to expand a session)
bind w choose-tree -Zs

# initialize tpm (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
