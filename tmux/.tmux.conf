# leader/prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# enable mouse scrolling
set -g mouse on

# terminal colours: enable true colour / 256-colour support
set -ag terminal-overrides ",*256col*:Tc"
set-option -g default-terminal "tmux-256color"

# window/pane creation: open new windows and splits in the current pane's path
bind c new-window -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# pane resize via arrow keys (repeatable while held)
# note: ctrl+hjkl is reserved for vim-tmux-navigator pane nav, and its -r
# repeat window would otherwise steal bare C-h/j/k/l from the plugin
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# move focus between panes via vim hjkl
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# kill current pane without confirmation prompt
bind x kill-pane

# fuzzy session/window switcher (fzf)
bind m display-popup -E -B -w 80% -h 80% "~/dotfiles/tmux/scripts/tmux-menu.sh"

# fuzzy-find a project and open/switch to its tmux session
bind f display-popup -E -B -w 90% -h 90% "~/dotfiles/tmux/scripts/tmux-sessionizer.sh"

# scrollback: keep 50000 lines of history per pane
set -g history-limit 50000

# when a session is destroyed, switch to another instead of detaching
set -g detach-on-destroy off

# start window/pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# plugins (managed by tpm): sensible defaults, session persistence
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto save / restore session state
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# add CPU and memory info
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position bottom
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold] | "
set -g status-right " #{cpu}  #{mem} "
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I: #W"
set -g window-status-format " #I: #W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"

# add prefix highlight to status line
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# fuzzy findable completions based on output
set -g @plugin 'laktak/extrakto'

# vim-aware pane nav (works with christoomey/vim-tmux-navigator in nvim)
set -g @plugin 'christoomey/vim-tmux-navigator'

# session/window tree: show sessions collapsed by default (press l to expand a session)
bind w choose-tree -Zs

# initialize tpm (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
